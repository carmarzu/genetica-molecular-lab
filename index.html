<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genética Molecular Lab · 4.º ESO</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18243b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:24px}header{background:#182c58;color:white;padding:26px;border-radius:20px}h1{margin:0 0 8px}header p{margin:0;color:#d8e5ff}.tabs,.modes,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button{border:1px solid #b8c6dc;background:white;color:#1d3564;border-radius:10px;padding:11px 15px;font-size:1rem;cursor:pointer}button.active,.primary{background:#2856a4;color:white;border-color:#2856a4}button:focus-visible{outline:3px solid orange}main{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 18px #16274414}.muted{color:#52627c}.seq{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.base{width:38px;height:44px;display:grid;place-items:center;background:#e5efff;border:1px solid #9db8ed;border-radius:7px;font-weight:700}.base.rna{background:#e5f6e9;border-color:#95d6a6}.base.unknown{background:#fff2d6;border-color:#eac778}.base.good{background:#dcf7e3;border-color:#48a869}.base.bad{background:#ffe3e3;border-color:#d66767}.arrow{font-size:22px;color:#657b9f;margin:8px}.stage{border:1px solid #d6e0ef;border-radius:14px;padding:18px;margin:15px 0;background:#f8faff}.progress{height:9px;border-radius:9px;background:#dbe3f1;overflow:hidden}.progress span{display:block;height:100%;background:#4479c8;transition:width .2s}.feedback{border-left:4px solid #3d71ba;background:#edf4ff;padding:12px;margin-top:16px;border-radius:5px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.choices button{min-width:45px}.small{font-size:.9rem}.legend{display:flex;gap:15px;flex-wrap:wrap}.legend span{padding:6px 10px;border-radius:8px;background:#eaf0fa}.wheel-wrap{overflow-x:auto;margin:16px 0}.wheel-wrap svg{display:block;width:min(100%,620px);height:auto;margin:auto}.wheel-help{font-size:.92rem;color:#52627c}.wheel-note{background:#fff8e7;border-left:4px solid #e6ad37;padding:10px;border-radius:6px}footer{padding:22px 0;color:#5e6c82;font-size:.85rem}@media(max-width:600px){.wrap{padding:10px}main{padding:16px}.base{width:31px;height:38px}}
</style></head><body><div class="wrap"><header><h1>🧬 Genética Molecular Lab</h1><p>Simula, experimenta y supera retos · Biología y Geología · 4.º ESO</p></header><nav class="tabs" id="tabs"></nav><main><div class="modes"><button id="guide" onclick="setMode('guide')">▶ Simulación guiada</button><button id="challenge" onclick="setMode('challenge')">★ Reto interactivo</button></div><div id="content" aria-live="polite"></div></main><footer>Versión 1.1 · Funciona sin conexión · No recopila datos personales · Los resultados se muestran solo en esta sesión.</footer></div><script>
const labs=[{name:'1. Replicación',title:'Replicación del ADN',steps:[['La doble hélice se abre','La helicasa separa las dos hebras. Cada una servirá de molde.'],['La ADN polimerasa construye','La ADN polimerasa añade nucleótidos complementarios y solo sintetiza en dirección 5′ → 3′.'],['Dos maneras de copiar','La hebra conductora se sintetiza de forma continua; la retardada, en fragmentos de Okazaki que después une la ligasa.'],['Resultado semiconservativo','Cada molécula hija contiene una hebra original y otra recién sintetizada.']]},{name:'2. Transcripción',title:'Transcripción: ADN → ARNm',steps:[['Se identifica el gen','La ARN polimerasa se une al ADN y abre localmente la doble hélice.'],['Se lee la hebra molde','La ARN polimerasa lee la hebra molde de ADN en sentido 3′ → 5′.'],['Se sintetiza el ARNm','El ARN se forma en sentido 5′ → 3′. En ARN hay uracilo (U) en lugar de timina (T).'],['El mensaje continúa','El ARNm producido puede utilizarse en la síntesis de proteínas. En células eucariotas, primero se procesa.']]},{name:'3. Traducción',title:'Traducción: ARNm → proteína',steps:[['Comienza en AUG','El ribosoma reconoce el codón de inicio AUG, que codifica metionina.'],['Se leen los codones','El ribosoma avanza por el ARNm de 5′ a 3′, leyendo grupos de tres bases.'],['Llegan los ARNt','Cada ARNt lleva un aminoácido y reconoce un codón mediante su anticodón complementario y antiparalelo.'],['Termina la traducción','Un codón de parada (UAA, UAG o UGA) detiene la síntesis. La cadena de aminoácidos se libera.']]}];
let lab=0,mode='guide',step=0,answers=[],done=false;const $=id=>document.getElementById(id);const comp={A:'T',T:'A',C:'G',G:'C'},rna={A:'U',T:'A',C:'G',G:'C'};const data=[{source:'ATGCCATG',expected:'TACGGTAC',label:'Hebra molde de ADN',target:'Nueva hebra de ADN',hint:'Empareja A con T y C con G.'},{source:'TACCGATTTACT',expected:'AUGGCUAAAUGA',label:'ADN molde 3′ → 5′',target:'ARNm 5′ → 3′',hint:'En el ARN, A se empareja con U; T con A; C con G; G con C.'},{source:'AUGGCUAAAUGA',expected:['Met','Ala','Lis','STOP'],label:'ARNm 5′ → 3′',target:'Secuencia de aminoácidos',hint:'AUG = Met, GCU = Ala, AAA = Lis, UGA = STOP.'}];
const geneticCode={UUU:'Fen',UUC:'Fen',UUA:'Leu',UUG:'Leu',UCU:'Ser',UCC:'Ser',UCA:'Ser',UCG:'Ser',UAU:'Tir',UAC:'Tir',UAA:'STOP',UAG:'STOP',UGU:'Cis',UGC:'Cis',UGA:'STOP',UGG:'Trp',CUU:'Leu',CUC:'Leu',CUA:'Leu',CUG:'Leu',CCU:'Pro',CCC:'Pro',CCA:'Pro',CCG:'Pro',CAU:'His',CAC:'His',CAA:'Gln',CAG:'Gln',CGU:'Arg',CGC:'Arg',CGA:'Arg',CGG:'Arg',AUU:'Ile',AUC:'Ile',AUA:'Ile',AUG:'Met',ACU:'Tre',ACC:'Tre',ACA:'Tre',ACG:'Tre',AAU:'Asn',AAC:'Asn',AAA:'Lis',AAG:'Lis',AGU:'Ser',AGC:'Ser',AGA:'Arg',AGG:'Arg',GUU:'Val',GUC:'Val',GUA:'Val',GUG:'Val',GCU:'Ala',GCC:'Ala',GCA:'Ala',GCG:'Ala',GAU:'Asp',GAC:'Asp',GAA:'Glu',GAG:'Glu',GGU:'Gli',GGC:'Gli',GGA:'Gli',GGG:'Gli'};
function wheel(){const order='UCAG',cx=320,cy=320;const polar=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const sector=(r1,r2,a1,a2,fill)=>{let [x1,y1]=polar(r1,a1),[x2,y2]=polar(r2,a1),[x3,y3]=polar(r2,a2),[x4,y4]=polar(r1,a2);return `<path d="M${x1},${y1} L${x2},${y2} A${r2},${r2} 0 0 1 ${x3},${y3} L${x4},${y4} A${r1},${r1} 0 0 0 ${x1},${y1} Z" fill="${fill}" stroke="white" stroke-width="1"/>`};const txt=(r,a,t,size=13,weight=600)=>{let [x,y]=polar(r,a);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="${size}" font-weight="${weight}" fill="#172a45">${t}</text>`};let svg='';for(let i=0;i<4;i++){let a1=-Math.PI/2+i*Math.PI/2,a2=a1+Math.PI/2;svg+=sector(0,66,a1,a2,['#d8eaff','#e3f5e5','#fff0d4','#f1e5ff'][i])+txt(40,(a1+a2)/2,order[i],23)}for(let i=0;i<16;i++){let a1=-Math.PI/2+i*Math.PI/8,a2=a1+Math.PI/8;svg+=sector(68,133,a1,a2,['#d8eaff','#e3f5e5','#fff0d4','#f1e5ff'][Math.floor(i/4)])+txt(104,(a1+a2)/2,order[i%4],16)}for(let i=0;i<64;i++){let a1=-Math.PI/2+i*Math.PI/32,a2=a1+Math.PI/32,first=order[Math.floor(i/16)],second=order[Math.floor(i/4)%4],third=order[i%4],aa=geneticCode[first+second+third];svg+=sector(135,191,a1,a2,['#d8eaff','#e3f5e5','#fff0d4','#f1e5ff'][Math.floor(i/16)])+txt(163,(a1+a2)/2,third,11);svg+=sector(193,296,a1,a2,aa==='STOP'?'#ffd4d4':i%2?'#f2f6fc':'#e7edf7');let [x,y]=polar(238,(a1+a2)/2);let rotation=((a1+a2)/2)*180/Math.PI+90;svg+=`<text transform="translate(${x},${y}) rotate(${rotation})" text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="${aa==='STOP'?10:11}" font-weight="600" fill="#172a45">${aa}</text>`}return `<section class="stage" aria-label="Código genético circular del ARN mensajero"><h3>🧬 Código genético circular</h3><p class="wheel-help">Lee cada codón de ARNm <strong>del centro hacia fuera</strong>: primera base → segunda base → tercera base → aminoácido.</p><div class="wheel-wrap"><svg viewBox="0 0 640 640" role="img" aria-label="Rueda del código genético con las 64 combinaciones de codones y sus aminoácidos">${svg}</svg></div><p class="wheel-note">AUG = Met (inicio). UAA, UAG y UGA = STOP (terminación). STOP no es un aminoácido.</p><p class="small muted">Abre la aplicación en horizontal o amplía la pantalla para leer mejor el círculo.</p></section>`}
function bases(s,cls=''){return `<div class="seq">${[...s].map(x=>`<span class="base ${cls}">${x}</span>`).join('')}</div>`}function setLab(i){lab=i;step=0;answers=[];done=false;render()}function setMode(m){mode=m;step=0;answers=[];done=false;render()}function render(){ $('tabs').innerHTML=labs.map((x,i)=>`<button class="${i===lab?'active':''}" onclick="setLab(${i})">${x.name}</button>`).join('');$('guide').className=mode==='guide'?'active':'';$('challenge').className=mode==='challenge'?'active':''; $('content').innerHTML=mode==='guide'?guideHTML():challengeHTML()}
function guideHTML(){const l=labs[lab],s=l.steps[step],pct=(step+1)/l.steps.length*100;let visual='';if(lab===0){visual=`<p class="small">Hebra original 5′ → 3′</p>${bases('ATGCCATG')}<p class="small">Hebra complementaria 3′ → 5′</p>${bases(step===0?'????????':step===1?'TAC?????':'TACGGTAC',step===0?'unknown':'rna')}<p class="muted small">${step===3?'Cada doble hélice hija conserva una hebra parental.':'Las dos hebras son antiparalelas.'}</p>`}if(lab===1){visual=`<p class="small">ADN molde 3′ → 5′</p>${bases('TACCGATTTACT')}<p class="small">ARNm 5′ → 3′</p>${bases(step<2?'????????????':step===2?'AUGGCU??????':'AUGGCUAAAUGA','rna')}`}if(lab===2){visual=`<p class="small">ARNm 5′ → 3′</p>${bases('AUGGCUAAAUGA','rna')}<p class="small">Codones: AUG | GCU | AAA | UGA</p><div class="legend">${['Met','Ala','Lis','STOP'].slice(0,step+1).map(x=>`<span>${x}</span>`).join('')}</div>`}return `<h2>${l.title}</h2><p class="muted">Paso ${step+1} de ${l.steps.length}</p><div class="progress"><span style="width:${pct}%"></span></div><div class="stage"><h3>${s[0]}</h3><p>${s[1]}</p>${visual}</div>${lab===2?wheel():''}<div class="actions"><button onclick="step=Math.max(0,step-1);render()" ${step===0?'disabled':''}>← Anterior</button><button class="primary" onclick="${step===3?"setMode('challenge')":"step++;render()"}">${step===3?'Ir al reto ★':'Siguiente →'}</button></div>`}
function challengeHTML(){const d=data[lab],total=lab===2?4:d.expected.length;let entry=lab===2?`<div class="seq">${['AUG','GCU','AAA','UGA'].map((x,i)=>`<span class="base rna" style="width:70px">${x}</span>`).join('')}</div><p>Selecciona el aminoácido correspondiente a cada codón, en orden.</p><div class="choices">${['Met','Ala','Lis','STOP'].map(x=>`<button onclick="add('${x}')">${x}</button>`).join('')}</div>`:`<p>${d.label}:</p>${bases(d.source)}<p>${d.target}:</p><div class="choices">${(lab===0?['A','T','C','G']:['A','U','C','G']).map(x=>`<button onclick="add('${x}')">${x}</button>`).join('')}</div>`;let seq=`<div class="seq">${Array.from({length:total},(_,i)=>`<span class="base ${i<answers.length?(done?(answers[i]===d.expected[i]?'good':'bad'):'rna'):'unknown'}" style="${lab===2?'width:70px':''}">${answers[i]||'?'}</span>`).join('')}</div>`;let score=answers.filter((x,i)=>x===d.expected[i]).length;return `<h2>Reto: ${labs[lab].title}</h2><p class="muted">Completa el proceso. Recibirás una explicación al comprobar tu respuesta.</p><div class="stage">${entry}<h3>Tu respuesta (${answers.length}/${total})</h3>${seq}<div class="actions"><button onclick="answers.pop();done=false;render()" ${!answers.length?'disabled':''}>↶ Deshacer</button><button onclick="answers=[];done=false;render()">Reiniciar</button><button class="primary" onclick="done=true;render()" ${answers.length!==total?'disabled':''}>Comprobar</button></div>${lab===2?wheel():''}${done?`<div class="feedback"><strong>${score===total?'¡Excelente!':'Has acertado '+score+' de '+total+'.'}</strong><p>${score===total?'Has aplicado correctamente las reglas del proceso.':'Las casillas rojas muestran los errores. Revisa las reglas e inténtalo de nuevo.'}</p><p>${d.hint}</p>${lab===0?'<p>Recuerda: la replicación completa produce dos moléculas semiconservativas; aquí has completado solo una hebra complementaria.</p>':''}${lab===2?'<p>STOP no es un aminoácido: indica la terminación de la traducción.</p>':''}</div>`:''}</div>`}function add(x){const max=lab===2?4:data[lab].expected.length;if(answers.length<max){answers.push(x);done=false;render()}}render();
</script></body></html>
